<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Global Freelancer Calc</title>

   <link rel="stylesheet" href="style.css">

</head>
<body>


    <div class="container">
    <h1>Global Freelance Calculator 🌍</h1>
    
    <div class="input-group">
        <label>Monthly Target (USD/EUR):</label>
        <input type="number" id="monthlyValue" placeholder="Ex: 5000">
    </div>

    <div class="input-group">
        <label>Hours per Day:</label>
        <input type="number" id="hoursPerDay" placeholder="Ex: 6">
    </div>

    <div class="input-group">
        <label>Days off per Month:</label>
        <input type="number" id="daysOff" placeholder="Ex: 8 (Weekends)">
    </div>

    <button onclick="calculate()">Calculate Hourly Rate</button>

    <h2 id="result">Result: $0.00 / hour</h2>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
