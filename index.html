<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Global Freelancer Calc</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; box-shadow: 2px 2px 10px #eee; }
        input { margin: 10px 0; padding: 8px; width: 100%; }
        button { background: #28a745; color: white; border: none; padding: 10px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Freelance Calculator 🌎</h2>
        <label>Hourly Rate (USD):</label>
        <input type="number" id="rate" placeholder="Ex: 20">
        
        <label>Hours per Month:</label>
        <input type="number" id="hours" placeholder="Ex: 160">
        
        <button onclick="calculate()">Calculate in BRL</button>
        
        <p id="result"></p>
    </div>

    <script>
        async function calculate() {
            const rate = document.getElementById('rate').value;
            const hours = document.getElementById('hours').value;
            
            // Aqui vamos buscar a cotação real!
            const response = await fetch('https://economia.awesomeapi.com.br/json/last/USD-BRL');
            const data = await response.json();
            const dollarQuote = data.USDBRL.bid;
            
            const totalBRL = (rate * hours) * dollarQuote;
            
            document.getElementById('result').innerText = 
                `Total: R$ ${totalBRL.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
        }
    </script>
</body>
</html>
